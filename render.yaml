# Render blueprint — Sentinel / SwarmOps backend (FastAPI) + managed Postgres.
#
# Deploy: Render Dashboard → New → Blueprint → select this repo → Apply.
# Render creates the Postgres database, wires DATABASE_URL, runs migrations +
# (idempotent) seed on start, and serves the API. Copy the service's public
# https URL — the Vercel frontend points NEXT_PUBLIC_API_URL at it, and the
# Alexa+ MCP server is served at <public-url>/mcp.
#
# No keys are required: the LLM mission workforce runs on the deterministic Mock
# provider, Ring runs on the documented Playground simulator (RING_PROVIDER=auto),
# and Bedrock perception falls back to a deterministic Mock (PERCEPTION_PROVIDER=auto),
# so the full /sentinel guided demo works out of the box. Add RING_*/BEDROCK_*/AWS_*
# env vars to go live. CORS is open ("*") for the frontend; tighten later if you like.
services:
  - type: web
    name: swarmops-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swarmops-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_EVENT_DELAY_MS
        value: "250"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: swarmops-db
    plan: free
