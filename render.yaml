# Render blueprint — Sentinel API (FastAPI). No database: Sentinel's authoritative
# state is in-process.
#
# Deploy: Render Dashboard → New → Blueprint → select this repo → Apply.
# Copy the service's public https URL — the Vercel frontend points
# NEXT_PUBLIC_API_URL at it, and the Alexa+-compatible MCP server is served at
# <public-url>/mcp.
#
# No keys are required: Ring runs on the documented Playground simulator
# (RING_PROVIDER=auto) and Bedrock perception falls back to a deterministic Mock
# (PERCEPTION_PROVIDER=auto), so the full /sentinel guided demo works out of the
# box. Add RING_*/BEDROCK_*/AWS_* env vars to go live. CORS is open ("*") for the
# frontend; tighten to the exact origin later if you like.
services:
  - type: web
    name: sentinel-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
